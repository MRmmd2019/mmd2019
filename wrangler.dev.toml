# Local development config — identical to wrangler.toml plus the local D1
# binding so `npm run dev:full` gets a simulated database via Miniflare.
# CI/production uses wrangler.toml (D1 attached via dashboard bindings).
name = "miliconfigpro-v1"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/status/*"]

# Same owner pin as production, so local runs behave identically.
[vars]
OWNER_EMAIL = "milad201400@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "miliconfigpro-v1"
database_id = "local"

[observability]
enabled = true
